name: Release

on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ windows, macos ]
    uses: ./.github/workflows/_build-package.yml
    with:
      platform: ${{ matrix.platform }}
      retention_days: 90

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts

      - name: Flatten and version filenames
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          find artifacts -name '*.zip' -exec mv -f {} artifacts/ \;
          find artifacts -mindepth 1 -type d -empty -delete
          for f in artifacts/package-*.zip; do
            platform=$(basename "$f" .zip | sed 's/^package-//')
            mv -f "$f" "artifacts/roblox-modloader-${version}-${platform}.zip"
          done
          ls -l artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/publish-release.sh \
            "${GITHUB_REF_NAME}" \
            "Roblox ModLoader ${GITHUB_REF_NAME}" \
            artifacts
