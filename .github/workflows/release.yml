name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v1.0.0'

env:
  BUILD_TYPE: Release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup MSVC (latest)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.tag }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          $version_clean = $version -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "version_clean=$version_clean" >> $env:GITHUB_OUTPUT
          echo "Version: $version"
        shell: powershell

      - name: Build managed solutions
        shell: bash
        run: |
          set -euo pipefail
          for sln in \
            "code/dotnet/Runtime/Runtime.slnx" \
            "code/dotnet/Roblox/Roblox.slnx" \
            "examples/example_dotnet/ExampleMod.slnx" \
            "examples/discord_rpc_dotnet/RobloxDiscord.RPC.slnx"; do
            echo "::group::dotnet build $sln"
            dotnet build "$sln" -c "$BUILD_TYPE" --nologo
            echo "::endgroup::"
          done

      - name: Publish managed runtime
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish code/dotnet/Runtime/src/RML.NativeHost/RML.NativeHost.csproj -c "$BUILD_TYPE" -o publish/managed --nologo
          dotnet publish code/dotnet/Runtime/src/RML.Core/RML.Core.csproj          -c "$BUILD_TYPE" -o publish/managed --nologo

      - name: Publish example mods
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish examples/example_dotnet/src/ExampleMod/ExampleMod.csproj                  -c "$BUILD_TYPE" -o publish/mods/ExampleMod --nologo
          dotnet publish examples/discord_rpc_dotnet/src/RobloxDiscord.RPC/RobloxDiscord.RPC.csproj -c "$BUILD_TYPE" -o publish/mods/DiscordRpc  --nologo

      - name: Build with MSVC (Release)
        run: |
          cmake -B build-msvc -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          cmake --build build-msvc --parallel

      - name: Create release package
        shell: powershell
        run: |
          $root = "release/RobloxModLoader"
          New-Item -ItemType Directory -Force -Path "$root/managed" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/mods" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/examples" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/docs" | Out-Null

          Copy-Item "build-msvc/code/roblox_modloader/roblox_modloader.dll" "$root/"
          if (Test-Path "build-msvc/dwmapi.dll") {
            Copy-Item "build-msvc/dwmapi.dll" "$root/"
          }

          Copy-Item "publish/managed/*" "$root/managed/" -Recurse -Force

          if (Test-Path "publish/mods") {
            Copy-Item "publish/mods/*" "$root/mods/" -Recurse -Force
          }

          if (Test-Path "build-msvc/examples") {
            Get-ChildItem "build-msvc/examples" -Recurse -Filter "*.dll" | ForEach-Object {
              $relativePath = $_.FullName.Substring((Resolve-Path "build-msvc/examples").Path.Length + 1)
              $destPath = "$root/examples/$relativePath"
              New-Item -ItemType Directory -Force -Path (Split-Path $destPath -Parent) | Out-Null
              Copy-Item $_.FullName $destPath
            }
          }

          Copy-Item "README.md" "$root/"
          if (Test-Path "docs") { Copy-Item "docs/*" "$root/docs/" -Recurse -Force }
          Get-ChildItem "examples" -Recurse -Include *.luau, *.lua, *.toml -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "$root/examples/"
          }

          $zip = "roblox-modloader-${{ steps.version.outputs.version_clean }}.zip"
          Compress-Archive -Path $root -DestinationPath $zip -Force
          $hash = Get-FileHash $zip -Algorithm SHA256
          "$($hash.Hash)  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ASCII

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: "Roblox ModLoader ${{ steps.version.outputs.version }}"
          generateReleaseNotes: true
          artifacts: |
            roblox-modloader-${{ steps.version.outputs.version_clean }}.zip
            roblox-modloader-${{ steps.version.outputs.version_clean }}.zip.sha256
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.version.outputs.version_clean }}
          path: |
            roblox-modloader-${{ steps.version.outputs.version_clean }}.zip
            roblox-modloader-${{ steps.version.outputs.version_clean }}.zip.sha256
          retention-days: 90
