name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  managed:
    name: Managed (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build all managed solutions
        shell: bash
        run: |
          set -euo pipefail
          solutions=(
            "code/dotnet/Runtime/Runtime.slnx"
            "code/dotnet/Roblox/Roblox.slnx"
            "examples/example_dotnet/ExampleMod.slnx"
            "examples/discord_rpc_dotnet/RobloxDiscord.RPC.slnx"
          )
          for sln in "${solutions[@]}"; do
            echo "::group::dotnet build $sln (${{ matrix.config }})"
            dotnet build "$sln" -c "${{ matrix.config }}" --nologo
            echo "::endgroup::"
          done

      - name: Test managed
        shell: bash
        run: |
          set -euo pipefail
          dotnet test code/dotnet/Runtime/tests/RML.Interop.Tests/RML.Interop.Tests.csproj \
            -c "${{ matrix.config }}" --nologo

  lint-native:
    name: Lint (native, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: clang-format (first-party only)
        run: bash .github/scripts/clang-format-check.sh

  native:
    name: Native (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, RelWithDebInfo ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
        
      - name: Setup MSVC (latest)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            cmake-deps-${{ runner.os }}-

      - name: Configure CMake (Ninja + MSVC)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        run: cmake --build build --parallel

      - name: Verify loader DLL
        shell: pwsh
        run: |
          $dll = "build/code/roblox_modloader/roblox_modloader.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "Loader DLL not found at $dll"
            exit 1
          }
          $kb = [Math]::Round((Get-Item $dll).Length / 1KB, 2)
          Write-Host "OK: $dll ($kb KB)"

      - name: Upload loader artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-modloader-${{ matrix.config }}
          path: |
            build/code/roblox_modloader/roblox_modloader.dll
            build/code/roblox_modloader/roblox_modloader.pdb
          retention-days: 7
          if-no-files-found: error
