name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  resolve:
    name: Resolve build
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      head_sha: ${{ steps.find.outputs.head_sha }}
      needs_build: ${{ steps.find.outputs.needs_build }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow=ci.yml --branch develop --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "no green ci.yml run on develop; falling back to a fresh build"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')
          if ! grep -qx 'package-windows' <<<"$names" || ! grep -qx 'package-macos' <<<"$names"; then
            echo "run $run_id has no usable package artifacts; falling back to a fresh build"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_sha=$(gh run view "$run_id" --json headSha --jq '.headSha')
          echo "promoting run $run_id ($head_sha)"
          {
            echo "run_id=$run_id"
            echo "head_sha=$head_sha"
            echo "needs_build=false"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Fallback build
    needs: resolve
    if: needs.resolve.outputs.needs_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ windows, macos ]
    uses: ./.github/workflows/_build-package.yml
    with:
      platform: ${{ matrix.platform }}
      retention_days: 14

  publish:
    name: Publish nightly
    needs: [ resolve, build ]
    if: always() && needs.resolve.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download promoted artifacts
        if: needs.resolve.outputs.needs_build == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ needs.resolve.outputs.run_id }} --pattern 'package-*' --dir artifacts

      - name: Download fallback artifacts
        if: needs.resolve.outputs.needs_build == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts

      - name: Flatten artifact directory
        run: |
          set -euo pipefail
          find artifacts -name '*.zip' -exec mv -f {} artifacts/ \;
          find artifacts -mindepth 1 -type d -empty -delete
          ls -l artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.head_sha || github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.resolve.outputs.run_id || github.run_id }}
        run: |
          bash .github/scripts/publish-release.sh \
            nightly \
            "Nightly build" \
            artifacts \
            --prerelease
